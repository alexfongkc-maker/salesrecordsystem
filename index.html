<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Record PWA System</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="./manifest.json">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { 
        position: absolute; 
        left: 0; 
        top: 0; 
        width: 100%; 
        max-width: 210mm; /* A4 Width */
        padding: 15mm; 
        box-sizing: border-box;
      }
      .no-print { display: none !important; }
    }
    .toast-enter-active, .toast-leave-active { transition: all 0.3s ease; }
    .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateY(-20px); }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen">
  <div id="app" class="max-w-5xl mx-auto p-4 md:p-6 pb-20">
    
    <!-- Toast Notification -->
    <transition name="toast">
      <div v-if="toast.show" :class="toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'" class="fixed top-5 right-5 z-50 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 font-medium border border-white/20">
        <span>{{ toast.message }}</span>
      </div>
    </transition>

    <!-- Navigation Header -->
    <header class="flex flex-wrap justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 no-print gap-4">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Sales Record System</h1>
        <p class="text-xs text-gray-500">{{ companyName }}</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button @click="activeTab = 'entry'" :class="activeTab === 'entry' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Sales Entry</button>
        <button @click="activeTab = 'records'" :class="activeTab === 'records' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Records</button>
        <button @click="activeTab = 'reports'" :class="activeTab === 'reports' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Reports</button>
        <button @click="activeTab = 'settings'" :class="activeTab === 'settings' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Settings</button>
      </div>
    </header>

    <!-- Tab 1: Sales Entry -->
    <div v-if="activeTab === 'entry'" class="space-y-6 no-print">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="text-lg font-bold text-gray-800">New Sale Entry</h2>
          <button @click="syncRecords" class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg font-bold hover:bg-indigo-200">
            Sync {{ form.location }} Data
          </button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">POS Location</label>
            <select v-model="form.location" @change="onLocationChange" class="w-full border rounded-lg p-2 bg-white focus:ring-2 focus:ring-blue-500">
              <option v-for="loc in locations" :key="loc" :value="loc">{{ loc }}</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Brand</label>
            <div class="flex gap-2">
              <select v-model="form.brand" @change="onBrandChange" class="w-full border rounded-lg p-2 bg-white focus:ring-2 focus:ring-blue-500">
                <option v-for="b in brands" :key="b" :value="b">{{ b }}</option>
              </select>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Preset Model</label>
            <div class="flex gap-2 items-center">
              <select v-model="form.productIndex" @change="onProductChange" class="w-full border rounded-lg p-2 bg-white focus:ring-2 focus:ring-blue-500">
                <option :value="-1">-- Custom / Other Model --</option>
                <option v-for="(prod, idx) in currentProducts" :key="idx" :value="idx">
                  {{ prod.model }} ({{ prod.modelNo || 'No Model No.' }})
                </option>
              </select>
              <img v-if="form.productIndex !== -1 && currentProducts[form.productIndex]?.image" :src="currentProducts[form.productIndex].image" class="w-10 h-10 object-cover rounded border" />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Model Name / Code (Optional if photo provided)</label>
            <div class="flex gap-1.5 items-center flex-wrap sm:flex-nowrap">
              <input type="text" v-model="form.modelName" placeholder="Model name or photo" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 min-w-[120px]">
              
              <label class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1 cursor-pointer flex-shrink-0 border" title="Upload from Gallery">
                📁 Upload
                <input type="file" accept="image/*" @change="captureEntryImage" class="hidden">
              </label>

              <label class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1 cursor-pointer flex-shrink-0" title="Take a Photo">
                📷 Snap
                <input type="file" accept="image/*" capture="environment" @change="captureEntryImage" class="hidden">
              </label>

              <button @click="startBarcodeScan" class="bg-gray-800 hover:bg-gray-900 text-white px-2.5 py-2 rounded-lg text-xs font-bold flex-shrink-0">
                [|||] Scan
              </button>
            </div>
          </div>
        </div>

        <div v-if="form.image" class="flex items-center gap-4 p-3 bg-blue-50 border border-blue-200 rounded-xl">
          <img :src="form.image" class="w-20 h-20 object-cover rounded-lg border bg-white" />
          <div>
            <div class="text-sm font-bold text-blue-900">Product Photo Attached</div>
            <div class="text-xs text-blue-700">Photo attached and will be displayed in Records & Receipt</div>
            <button @click="form.image = null" class="mt-1 text-xs text-red-600 hover:underline">Remove Photo</button>
          </div>
        </div>

        <div v-show="isScanning" class="border-2 border-dashed border-gray-300 p-2 rounded-xl relative bg-black">
          <button @click="stopBarcodeScan" class="absolute top-2 right-2 z-10 bg-red-600 text-
